name: Backend CI

# No path filter on purpose: this runs on every PR so it can be a required check.
# A required check whose workflow is skipped by a path filter never reports, and
# the PR sits at "Expected — Waiting for status" forever.
on:
  pull_request:
  push:
    branches: [main]

jobs:
  build:
    name: Build and test (backend)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: "25"
      - uses: gradle/actions/setup-gradle@v6
      - run: ./gradlew build
      # Sprint 2: add `docker build`, and on push to main publish the image to GHCR.
