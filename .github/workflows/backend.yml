name: Backend CI and deployment

# Keep this workflow on every PR so a required status never disappears due to path filters.
on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  verify:
    name: Test backend
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: "25"
      - uses: gradle/actions/setup-gradle@v6
      - run: ./gradlew build

  docker-pr:
    name: Build Docker image (PR, no publish)
    if: github.event_name == 'pull_request'
    needs: verify
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: docker/setup-buildx-action@v4.3.0
      - uses: docker/build-push-action@v7.4.0
        with:
          context: ./backend
          file: ./backend/Dockerfile
          platforms: linux/amd64
          tags: magicshroom-api:pr
          push: false

  publish-image:
    name: Publish Docker image to GHCR
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    needs: verify
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@v7
      - uses: docker/setup-buildx-action@v4.3.0
      - uses: docker/login-action@v4.6.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - uses: docker/build-push-action@v7.4.0
        with:
          context: ./backend
          file: ./backend/Dockerfile
          platforms: linux/amd64
          push: true
          tags: |
            ghcr.io/notacatgirl/magicshroom-api:${{ github.sha }}
            ghcr.io/notacatgirl/magicshroom-api:main
          labels: |
            org.opencontainers.image.source=https://github.com/NotaCatgirl/MagicShroom
            org.opencontainers.image.revision=${{ github.sha }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

  deploy-render:
    name: Deploy published image to Render
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    needs: publish-image
    runs-on: ubuntu-latest
    steps:
      - name: Trigger Render deploy for this commit's image
        env:
          IMAGE_URL: ghcr.io/notacatgirl/magicshroom-api:${{ github.sha }}
          RENDER_DEPLOY_HOOK_URL: ${{ secrets.RENDER_DEPLOY_HOOK_URL }}
        run: |
          if [[ -z "$RENDER_DEPLOY_HOOK_URL" ]]; then
            echo "::error::Add the Render service deploy hook as the RENDER_DEPLOY_HOOK_URL repository secret."
            exit 1
          fi
          curl --fail --silent --show-error --get \
            --data-urlencode "imgURL=$IMAGE_URL" \
            "$RENDER_DEPLOY_HOOK_URL"
