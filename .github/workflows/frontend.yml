name: Frontend CI

# No path filter on purpose: see backend.yml.
on:
  pull_request:
  push:
    branches: [main]

jobs:
  build:
    name: Build and test (frontend)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: "25"
      - uses: gradle/actions/setup-gradle@v6
      # detekt fails the job on any finding not in config/detekt/baseline.xml. The backend workflow
      # gets detekt from `./gradlew build`, whose check task depends on it.
      # Require live API integration tests in CI as well as the regular unit tests.
      - run: ./gradlew :app:detekt :app:testDebugUnitTest :app:assembleDebug -PliveApiTests=true
