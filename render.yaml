services:
  - type: web
    name: magicshroom-api
    runtime: image
    plan: free
    image:
      url: ghcr.io/notacatgirl/magicshroom-api:main
      creds:
        fromRegistryCreds:
          name: ghcr-read
    healthCheckPath: /actuator/health
    envVars:
      - key: DATABASE_URL
        sync: false
      - key: DATABASE_USER
        sync: false
      - key: DATABASE_PASSWORD
        sync: false
      - key: SUPABASE_URL
        sync: false
      - key: SUPABASE_AUTH_ADMIN_KEY
        sync: false
