spring:
  application:
    name: magicshroom-api
  profiles:
    default: postgres
  datasource:
    url: ${DATABASE_URL:jdbc:postgresql://localhost:5432/magicshroom}
    username: ${DATABASE_USER:magicshroom}
    password: ${DATABASE_PASSWORD:}

server:
  port: ${PORT:8080}

magicshroom:
  auth:
    issuer: ${SUPABASE_URL}/auth/v1
    # Server-only Supabase key used for Auth Admin API calls.
    admin-key: ${SUPABASE_AUTH_ADMIN_KEY:${SUPABASE_SECRET_KEY:}}
  stub-auth:
    default-user-id: 2
