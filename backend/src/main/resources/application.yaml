spring:
  application:
    name: magicshroom-api
  profiles:
    default: postgres
  datasource:
    url: ${DATABASE_URL:jdbc:postgresql://localhost:5432/magicshroom}
    username: ${DATABASE_USER:magicshroom}
    password: ${DATABASE_PASSWORD:}

magicshroom:
  auth:
    issuer: ${SUPABASE_URL}/auth/v1
  stub-auth:
    default-user-id: 2
