spring:
  application:
    name: magicshroom-api
  profiles:
    default: postgres
  datasource:
    url: ${DATABASE_URL:jdbc:postgresql://localhost:5432/magicshroom}
    username: ${DATABASE_USER:magicshroom}
    password: ${DATABASE_PASSWORD:}

server:
  port: ${PORT:8080}

magicshroom:
  auth:
    issuer: ${SUPABASE_URL}/auth/v1
    # Server-only Supabase secret key (sb_secret_... or legacy service_role). Optional: without it,
    # deleting a user removes their app data but not their Supabase Auth login.
    secret-key: ${SUPABASE_SECRET_KEY:}
  stub-auth:
    default-user-id: 2
