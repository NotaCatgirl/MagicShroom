spring:
  application:
    name: magicshroom-api
  profiles:
    # "mock" serves data from src/main/resources/mock-data/*.json (see repository/json/).
    # When the Supabase repositories exist, give them their own profile and change this default.
    default: mock
  # TODO(db): no datasource is configured, so bootRun falls back to in-memory H2. Spring does not read
  #  .env files: map the SUPABASE_* variables from .env.example to spring.datasource.url / username /
  #  password with ${...} placeholders, and set them in the run configuration or shell.

magicshroom:
  stub-auth:
    # Caller used when a request has no X-Stub-User-Id header (2 = a regular user, 1 = admin).
    # Goes away with StubCurrentUserResolver once OAuth2 is in place.
    default-user-id: 2
