spring.application.name=magicshroom-api
spring.profiles.default=mock
spring.flyway.enabled=false
magicshroom.stub-auth.default-user-id=2
# No Supabase in tests: mock-profile tests use stub auth, and SupabasePostgresAuthIntegrationTest
# points the issuer at its own mock Auth server.
magicshroom.auth.issuer=

spring.datasource.url=jdbc:h2:mem:testdb
spring.datasource.driverClassName=org.h2.Driver
spring.datasource.username=sa
spring.datasource.password=
